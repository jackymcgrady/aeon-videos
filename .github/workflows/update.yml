name: update from aeon.co

on:
  schedule:
    - cron: '17 19 * * *'   # 03:17 Asia/Shanghai daily
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Deploy even if data.js is unchanged'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: aeon-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh data from the Aeon video sitemap
        run: |
          chmod +x update.sh
          ./update.sh

      - name: Commit new data if it changed
        id: data
        run: |
          if git diff --quiet -- data.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "data.js unchanged"
          else
            git config user.name "aeon-updater"
            git config user.email "actions@users.noreply.github.com"
            git add data.js
            git commit -m "data: refresh from aeon.co sitemap ($(date -u +%F))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "data.js updated and pushed"
          fi

      - name: Install function dependencies
        run: npm ci

      - name: Deploy to Netlify
        if: steps.data.outputs.changed == 'true' || inputs.force_deploy == true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@latest deploy --prod --dir . --functions netlify/functions --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" 2>&1 | tail -5
